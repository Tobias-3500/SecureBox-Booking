# nginx-4xx.conf — Filter der fortæller Fail2ban hvordan en "4xx-fejl" ser ud i nginx' access-log.
# <HOST> markerer hvor IP-adressen står, og 4\d\d matcher statuskoder i 400-serien.
[Definition]
failregex = ^<HOST> - .* "(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS) .*" 4\d\d \d+ ".*" ".*"$
            ^<HOST> - .* "(GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS) .*" 4\d\d \d+ .*$

ignoreregex =
