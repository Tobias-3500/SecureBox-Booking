name: Deploy to VM

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SKIP_ENV_VALIDATION: true
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ghcr.io/tobias-3500/securebox-booking-backend:latest
      IMAGE_FRONTEND: ghcr.io/tobias-3500/securebox-booking-frontend:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./website/backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./website/frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

      - name: Validate required ENV_FILE variables
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          raw = os.environ.get("ENV_FILE_CONTENT", "")
          if not raw.strip():
              print("ENV_FILE secret is empty.")
              sys.exit(1)

          values = {}
          for line in raw.splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip().strip('"').strip("'")

          required = [
              "NODE_ENV",
              "DB_HOST",
              "DB_PORT",
              "DB_USER",
              "DB_PASSWORD",
              "DB_NAME",
              "BACKEND_PORT",
              "JWT_SECRET",
              "CORS_ORIGIN",
              "RESEND_API_KEY",
              "ADMIN_EMAIL",
              "RESEND_FROM",
          ]
          missing = [key for key in required if not values.get(key)]

          if missing:
              print("ENV_FILE is missing required keys for backend env validation:")
              print(", ".join(missing))
              sys.exit(1)

          print("ENV_FILE validation passed.")
          PY

      - name: Create .env file from secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Use docker-compose.prod.yml (image-only); do not overwrite VM's docker-compose.yml.
          # certbot/, renew_ssl.sh, backup script and VPN config on VM are left untouched.
          source: "docker-compose.prod.yml,.env,nginx.conf,website/"
          target: ${{ secrets.VM_PROJECT_PATH }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            if [ -d "nginx.conf" ]; then rm -rf nginx.conf; fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans