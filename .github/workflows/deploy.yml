# ============================================================================
# deploy.yml — Automatisk udrulning (CI/CD) med GitHub Actions.
#
# HVAD FILEN GØR:
# Kører automatisk, hver gang der pushes til 'main'. Trinene er:
#   1) Byg Docker-images for backend og frontend
#   2) Push dem til GitHub Container Registry (ghcr.io)
#   3) Lav en .env-fil ud fra en GitHub Secret
#   4) Kopiér nødvendige filer til produktions-VM'en (via SCP)
#   5) SSH til VM'en, validér at .env er komplet, og start systemet med docker compose
#
# Hvis valideringen eller opstart fejler, stopper deployment og loggen viser fejlen,
# så produktionen forbliver på den tidligere version.
#
# Alle hemmeligheder (VM-adgang, .env-indhold) ligger som GitHub Secrets — aldrig i koden.
# ============================================================================

name: Deploy to VM

# Udløses ved push til main-branchen.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SKIP_ENV_VALIDATION: true
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ghcr.io/tobias-3500/securebox-booking-backend:latest
      IMAGE_FRONTEND: ghcr.io/tobias-3500/securebox-booking-frontend:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./website/backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./website/frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

      - name: Create .env file from secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE_CONTENT" > .env

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Use docker-compose.prod.yml (image-only); do not overwrite VM's docker-compose.yml.
          # certbot/, renew_ssl.sh, backup script and VPN config on VM are left untouched.
          source: ".env,docker-compose.prod.yml,nginx.conf,website/"
          target: ${{ secrets.VM_PROJECT_PATH }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            if [ ! -s .env ]; then
              echo ".env mangler eller er tom på VM"
              exit 1
            fi
            required_vars="POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB NODE_ENV DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME BACKEND_PORT JWT_SECRET CORS_ORIGIN"
            for var in $required_vars; do
              if ! grep -q "^${var}=" .env; then
                echo "Manglende variabel i .env: ${var}"
                exit 1
              fi
            done
            if grep -q "^GOOGLE_CALENDAR_ENABLED=true" .env; then
              google_required_vars="GOOGLE_CALENDAR_ID GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY GOOGLE_CALENDAR_TIMEZONE"
              for var in $google_required_vars; do
                if ! grep -q "^${var}=" .env; then
                  echo "Manglende Google Calendar variabel i .env: ${var}"
                  exit 1
                fi
              done
              if grep -Eq "DIN_PERSONLIGE_EMAIL_HER|navn-på-service-account|DIN_LANGE_PRIVATE_KEY_HER|\.\.\." .env; then
                echo "Google Calendar er enabled, men .env indeholder stadig placeholder-værdier"
                echo "Sæt GOOGLE_CALENDAR_ENABLED=false, eller udfyld rigtige Google Calendar credentials"
                exit 1
              fi
            fi
            if [ -d "nginx.conf" ]; then rm -rf nginx.conf; fi
            docker compose --env-file .env -f docker-compose.prod.yml pull
            if ! docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans; then
              echo "Docker Compose deployment fejlede. Seneste backend logs:"
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 backend || true
              echo "Seneste backend error.log fra ./logs:"
              tail -n 100 ./logs/error.log || true
              echo "Seneste backend combined.log fra ./logs:"
              tail -n 100 ./logs/combined.log || true
              exit 1
            fi