name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_BACKEND: ghcr.io/tobias-3500/salon-backend:latest
      IMAGE_FRONTEND: ghcr.io/tobias-3500/salon-frontend:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./website/backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./website/frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}

      - name: Create .env file from secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # TILFØJET: nginx.conf er nu med i listen over filer
          source: "docker-compose.yml,.env,nginx.conf,website/"
          target: ${{ secrets.VM_PROJECT_PATH }}

      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            
            # FIX: Slet nginx.conf hvis det er en mappe (Docker fejl-oprettelse)
            if [ -d "nginx.conf" ]; then
              echo "Rydder op i forkert nginx.conf mappe..."
              rm -rf nginx.conf
            fi

            echo "Tjekker filer i roden:"
            ls -la
            
            docker compose pull
            docker compose up -d --remove-orphans