# ============================================================================
# docker-compose.yml — Lokal/byg-opsætning af hele systemet.
#
# HVAD FILEN GØR:
# Definerer de fire containere (services), systemet består af, og hvordan de hænger
# sammen. "docker compose up" starter dem alle med ét netværk imellem.
#
#   nginx     -> offentlig indgang (reverse proxy). Eneste container med åbne porte udadtil.
#   db        -> PostgreSQL-database (kun intern, 'expose')
#   backend   -> Node.js/Express API (kun intern, 'expose')
#   frontend  -> de færdige React-filer serveret af nginx (kun intern, 'expose')
#
# Vigtigt sikkerhedsvalg: kun nginx bruger 'ports' (åben mod internettet). De øvrige
# bruger 'expose', så de kun kan nås internt i Docker-netværket.
# (Produktion bruger docker-compose.prod.yml, som kører færdigbyggede images.)
# ============================================================================
services:
  # Nginx fungerer som offentlig reverse proxy foran frontend og backend.
  nginx:
    image: nginx:alpine
    container_name: salon_router
    ports:
      - "80:80"
      - "443:443" # HTTPS-trafik, når certbot-certifikater er monteret.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt # Gemmer SSL-certifikater.
      - ./certbot/www:/var/www/certbot  # Bruges til domæneverificering.
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # PostgreSQL-databasen gemmer bookingdata i et persistent Docker-volume.
  db:
    image: postgres:15-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./website/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    healthcheck:
      # Compose bruger dette til at vente, indtil databasen er klar til forbindelser.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API'et kører kun internt i Docker-netværket og nås via nginx.
  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    image: ghcr.io/tobias-3500/securebox-booking-backend:latest
    container_name: salon_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Nginx/frontend venter på, at API'et svarer OK.
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend serveres internt på port 80 og eksponeres offentligt gennem nginx.
  frontend:
    build:
      context: ./website/frontend
      dockerfile: Dockerfile
    image: ghcr.io/tobias-3500/securebox-booking-frontend:latest
    container_name: salon_frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: