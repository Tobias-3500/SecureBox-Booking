# Local development override.
# Docker Compose merger denne fil automatisk med docker-compose.yml, når du kører lokalt.
# Brug den til lokal HTTP-test uden SSL-certifikater.
# På VM/produktion bør du køre uden denne override-fil, eller eksplicit vælge prod-filen.
services:
  nginx:
    # Skifter nginx til lokal konfiguration, så localhost virker uden certbot.
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  # Eksponerer frontend direkte på hosten, så http://localhost:3000 virker lokalt.
  frontend:
    ports:
      - "3000:80"
