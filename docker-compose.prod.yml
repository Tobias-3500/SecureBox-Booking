# Production / VM setup.
# Denne fil bruger prebuilt images fra GitHub Container Registry og er beregnet til VM'en.
services:
  # Nginx er den offentlige reverse proxy, som modtager HTTP/HTTPS trafik.
  nginx:
    image: nginx:alpine
    container_name: salon_router
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /var/log/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy # Venter på at backend svarer OK på /api/health.

  # Databasen bruger et named volume, så data overlever container-genstarter.
  db:
    image: postgres:15-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./website/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    # Healthcheck sikrer, at backend først starter når PostgreSQL accepterer forbindelser.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API'et får alle runtime secrets fra .env-filen på VM'en.
  backend:
    image: ghcr.io/tobias-3500/securebox-booking-backend:latest
    container_name: salon_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-Europe/Copenhagen}
    expose:
      - "3001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy # Starter først når DB rent faktisk er klar til forbindelser.
    # Healthcheck bruges af nginx/frontend afhængighederne.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend serveres internt og bliver først startet efter backend er sund.
  frontend:
    image: ghcr.io/tobias-3500/securebox-booking-frontend:latest
    container_name: salon_frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy # Viser først frontend når backend er klar.

volumes:
  # Persistent database-data. Slet ikke dette volume uden backup.
  postgres_data: