# Production / VM setup
services:
  # Temporary comment for commit test
  # Trigger comment for new push
  nginx:
    image: nginx:alpine
    container_name: salon_router
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /var/log/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy # VENTER på at backend svarer OK på /api/health

  db:
    image: postgres:15-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./website/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    # --- NYT: HEALTHCHECK FOR DATABASE ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/tobias-3500/securebox-booking-backend:latest
    container_name: salon_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    expose:
      - "3001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy # Starter først når DB rent faktisk er klar til forbindelser
    # --- NYT: HEALTHCHECK FOR BACKEND ---
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/tobias-3500/securebox-booking-frontend:latest
    container_name: salon_frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy # Viser først frontend når backend er klar

volumes:
  postgres_data: