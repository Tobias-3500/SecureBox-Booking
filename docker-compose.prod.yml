# Production / VM: pull and run images only (no build).
# Use: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Does not touch certbot/, renew_ssl.sh, or any backup/VPN config on the VM.
services:
  nginx:
    image: nginx:alpine
    container_name: salon_router
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./website/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/tobias-3500/salon-backend:latest
    container_name: salon_backend
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # BACKUP_* use :- so Compose does not warn when unset (admin backup features stay disabled until you set them in .env).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      BACKUP_VM_HOST: ${BACKUP_VM_HOST:-}
      BACKUP_SCRIPT_PATH: ${BACKUP_SCRIPT_PATH:-}
      BACKUP_LOG_PATH: ${BACKUP_LOG_PATH:-}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/tobias-3500/salon-frontend:latest
    container_name: salon_frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
