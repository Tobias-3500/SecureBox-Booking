server {
    listen 80;
    server_name securebox.dk www.securebox.dk;

    # Certbot verificering (beholdes til fremtidige fornyelser)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Send alt trafik fra HTTP til HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name securebox.dk www.securebox.dk;

    # SSL Certifikater (Dem vi lige har hentet)
    ssl_certificate /etc/letsencrypt/live/securebox.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securebox.dk/privkey.pem;

    # Sikkerhedsindstillinger
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Frontend
    location / {
        proxy_pass http://salon_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api {
        proxy_pass http://salon_backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}